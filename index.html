<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project wiki</title>
  <meta name="description" content="A personal wiki of projects.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%23000'/%3E%3Crect x='9' y='9' width='6' height='6' rx='1' fill='white'/%3E%3Crect x='17' y='9' width='6' height='6' rx='1' fill='white'/%3E%3Crect x='9' y='17' width='6' height='6' rx='1' fill='white'/%3E%3Crect x='17' y='17' width='6' height='6' rx='1' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap">
  <link rel="stylesheet" href="assets/css/wiki.css">
  <script>
    try { var t = localStorage.getItem("wiki-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar" id="topbar">
    <a class="ident" href="#/" id="ident">
      <span class="ident-name" id="ident-name">Your Name</span>
      <span class="ident-loc" id="ident-loc"></span>
    </a>

    <nav class="pill" aria-label="Views">
      <a href="#/" class="pill-btn" data-nav="work" aria-label="Work" title="Work">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="2" y="2" width="6" height="6" rx="1"/><rect x="10" y="2" width="6" height="6" rx="1"/><rect x="2" y="10" width="6" height="6" rx="1"/><rect x="10" y="10" width="6" height="6" rx="1"/></svg>
      </a>
      <a href="#/index" class="pill-btn" data-nav="index" aria-label="Index" title="Index">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
      </a>
      <button type="button" class="pill-btn" id="search-open" aria-label="Search" title="Search (/)">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="8" cy="8" r="5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 12l3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </nav>

    <nav class="toplinks" aria-label="Elsewhere">
      <span id="social-links" class="social-links"></span>
      <a href="#/page/about" data-nav="page:about" class="toplink-strong">About</a>
    </nav>
  </header>

  <main id="main" tabindex="-1">
    <div id="view" aria-live="polite"></div>
  </main>

  <footer class="footer" id="footer"></footer>

  <dialog class="search" id="search-dialog" aria-label="Search the wiki">
    <form method="dialog" class="search-form" id="search-form">
      <label class="search-field">
        <svg width="20" height="20" viewBox="0 0 18 18" aria-hidden="true"><circle cx="8" cy="8" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 12l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span class="visually-hidden">Search</span>
        <input id="search" type="search" placeholder="Search projects, tags, tools" autocomplete="off">
        <button type="button" class="search-close" id="search-close">Esc</button>
      </label>
      <ul class="search-results" id="search-results" role="listbox" aria-label="Results"></ul>
    </form>
  </dialog>

  <script src="assets/vendor/marked.umd.js"></script>
  <script src="assets/vendor/highlight.min.js"></script>
  <script src="assets/js/wiki.js"></script>
</body>
</html>
